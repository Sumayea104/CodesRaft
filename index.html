<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02020a">
<title>CodesRaft | Employee Directory</title>
<style>

  :root {
    --bg: #02020a;
    --blue: #4f8cff;
    --purple: #9b6bff;
    --accent: #9fb4ff;
    --line: rgba(122, 162, 255, .30);
    --glow-blue: rgba(79, 140, 255, .35);
    --glow-purple: rgba(155, 107, 255, .35);
    --text: #ffffff;
    --muted: #b9b9d0;

    --page-pad: clamp(18px, 4vw, 40px);
    --gap: clamp(14px, 2.4vw, 26px);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(600px 400px at 15% 0%, rgba(79,140,255,.18), transparent 70%),
      radial-gradient(600px 400px at 85% 10%, rgba(155,107,255,.20), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    padding:
      max(clamp(12px, 3vw, 35px), env(safe-area-inset-top))
      max(clamp(12px, 3vw, 35px), env(safe-area-inset-right))
      max(clamp(12px, 3vw, 35px), env(safe-area-inset-bottom))
      max(clamp(12px, 3vw, 35px), env(safe-area-inset-left));
  }

  img { max-width: 100%; }

  .page {
    width: 100%;
    max-width: 1080px;
    padding: var(--page-pad);
    background: linear-gradient(160deg, #101018 0%, #000 100%);
    border: 1px solid var(--line);
    border-radius: clamp(14px, 2vw, 22px);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, .85),
      0 0 90px rgba(79, 140, 255, .10),
      0 0 120px rgba(155, 107, 255, .10);
  }

  .header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--gap);
    padding-bottom: clamp(16px, 3vw, 28px);
    margin-bottom: clamp(20px, 3.5vw, 36px);
    border-bottom: 1px solid var(--line);
  }

  .logo-box:first-child { justify-self: start; }
  .logo-box:last-child  { justify-self: end; }

  .logo {
    display: block;
    width: clamp(110px, 24vw, 280px);
    height: auto;
    aspect-ratio: 280 / 120;
    object-fit: contain;
    padding: 6px;
    background: #0a0a12;
    border: 1px solid rgba(140, 150, 255, .7);
    border-radius: clamp(12px, 1.6vw, 18px);
    box-shadow:
      0 0 0 4px rgba(122, 162, 255, .07),
      0 0 26px var(--glow-blue),
      0 0 40px rgba(155, 107, 255, .22);
    transition: box-shadow .4s ease, transform .4s ease;
  }

  .header-center { text-align: center; }

  .company-name {
    font-size: clamp(22px, 4.2vw, 34px);
    font-weight: 700;
    letter-spacing: clamp(3px, .8vw, 6px);
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff 0%, #bcd0ff 45%, #cdb6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(120, 150, 255, .45));
  }

  .company-sub {
    margin-top: 8px;
    color: #a9b8ff;
    font-size: clamp(10px, 1.5vw, 13px);
    letter-spacing: clamp(3px, 1vw, 7px);
    text-transform: uppercase;
  }

  .glow-line {
    position: relative;
    width: clamp(110px, 16vw, 160px);
    height: 2px;
    margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, var(--blue), var(--purple), transparent);
    box-shadow: 0 0 14px var(--glow-purple);
    overflow: hidden;
  }

  .glow-line::after {
    content: "";
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #e8eeff, transparent);
    animation: sweep 3.6s ease-in-out infinite;
  }

  @keyframes sweep {
    0%, 35%   { left: -40%; }
    80%, 100% { left: 110%; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: clamp(12px, 1.6vw, 18px);
    text-align: center;
    overflow: hidden;
    background: linear-gradient(180deg, #11111f 0%, #07070f 100%);
    border: 1px solid #23233a;
    border-radius: 18px;
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--i) * 90ms + 150ms);
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(122, 162, 255, .10), transparent 40%);
    pointer-events: none;
  }


  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }

  .photo-wrap {
    border: 1px solid rgba(140, 150, 255, .5);
    border-radius: 14px;
    overflow: hidden;
    background: #1a1a28;
  }

  .photo {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: top center;
    transition: transform .6s ease;
  }

  .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
  }

  .name {
    margin-top: 14px;
    font-size: clamp(16px, 2.2vw, 18px);
    font-weight: 600;
    letter-spacing: .5px;
    overflow-wrap: anywhere;
  }

  .divider {
    width: 45px;
    height: 2px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    box-shadow: 0 0 10px var(--glow-purple);
    transition: width .35s ease;
  }

  .role {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.55;
  }

  .role h3 {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  .role h3:last-child {
    color: var(--muted);
    text-transform: none;
    letter-spacing: .3px;
  }

  @media (hover: hover) {
    .logo:hover {
      transform: scale(1.04);
      box-shadow:
        0 0 0 4px rgba(122, 162, 255, .16),
        0 0 34px rgba(79, 140, 255, .6),
        0 0 56px rgba(155, 107, 255, .45);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: transparent;
      box-shadow:
        0 18px 44px rgba(0, 0, 0, .65),
        0 0 34px rgba(79, 140, 255, .28),
        0 0 50px rgba(155, 107, 255, .22);
    }

    .card:hover::after { opacity: 1; }
    .card:hover .photo { transform: scale(1.05); }
    .card:hover .divider { width: 90px; }
  }



  /* Tablet: 2 columns */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Phone: stacked header, 1 column */
  @media (max-width: 720px) {
    .header { grid-template-columns: 1fr 1fr; }
    .header-center { grid-column: 1 / -1; grid-row: 2; }
    .logo { width: min(100%, 190px); }

    .grid {
      grid-template-columns: 1fr;
      max-width: 420px;
      margin-inline: auto;
    }

    .photo { aspect-ratio: 4 / 5; }
  }

  /* Very small phones */
  @media (max-width: 360px) {
    .company-name { letter-spacing: 2px; }
    .company-sub  { letter-spacing: 2px; }
  }

  /* Phone landscape */
  @media (max-height: 480px) and (orientation: landscape) {
    .grid { grid-template-columns: repeat(3, 1fr); max-width: none; }
    .photo { aspect-ratio: 1 / 1; }
  }

  /* Large screens / TV */
  @media (min-width: 1600px) {
    .page { max-width: 1240px; }
  }

  .card:focus-within::after { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media print {
    body { background: #000; padding: 0; }
    .page { max-width: 100%; border-radius: 0; box-shadow: none; }
    .card { animation: none; break-inside: avoid; }
  }

  .card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card.is-open { opacity: 0; transition: opacity .25s ease; }
  .card:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(2, 2, 10, .72);
    -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility 0s linear .5s;
  }

  .overlay.open {
    opacity: 1;
    visibility: visible;
    transition: opacity .35s ease, visibility 0s;
  }

  .panel {
    position: relative;
    width: min(880px, 100%);
    max-height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    overflow: hidden;
    background: linear-gradient(180deg, #131326 0%, #07070f 100%);
    border: 1px solid rgba(140, 150, 255, .45);
    border-radius: 22px;
    box-shadow: 0 30px 90px rgba(0,0,0,.8),
                0 0 60px rgba(79,140,255,.25),
                0 0 90px rgba(155,107,255,.20);
    transform-origin: center;
    transition: transform .5s cubic-bezier(.22, .8, .2, 1);
    will-change: transform;
  }

  .d-photo { min-height: 0; background: #1a1a28; }

  .d-photo img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 320px;
    object-fit: cover;
    object-position: top center;
  }

  .d-body {
    padding: clamp(22px, 4vw, 40px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }

  .d-body h2 {
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight: 700;
    line-height: 1.2;
    background: linear-gradient(90deg, #fff 0%, #bcd0ff 50%, #cdb6ff 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    overflow-wrap: anywhere;
  }

  .d-title {
    margin-top: 8px;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .d-divider { margin: 16px 0 0; width: 56px; }

  .d-list { display: grid; gap: 14px; }

  .d-row {
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(122, 162, 255, .18);
  }

  .d-row:last-child { border-bottom: 0; padding-bottom: 0; }

  .d-row dt {
    color: #8793c9;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .d-row dd {
    margin-top: 4px;
    font-size: 15px;
    line-height: 1.45;
    color: #eceefa;
    overflow-wrap: anywhere;
  }

  .d-row a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(159,180,255,.4); }
  .d-row a:hover { color: #fff; }

  .d-bio { color: var(--muted); font-size: 14px; line-height: 1.65; }

  .close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    font-size: 24px;
    line-height: 1;
    color: #fff;
    background: rgba(10, 10, 24, .7);
    border: 1px solid rgba(140, 150, 255, .5);
    border-radius: 50%;
    cursor: pointer;
    transition: background .25s ease, box-shadow .25s ease, transform .25s ease;
  }

  .close:hover { background: rgba(79, 140, 255, .35); box-shadow: 0 0 18px var(--glow-blue); transform: rotate(90deg); }
  .close:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* content slides in a moment after the panel opens */
  .d-item, .d-bio {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .4s ease, transform .5s ease;
  }
  .overlay.open .d-item,
  .overlay.open .d-bio { opacity: 1; transform: none; transition-delay: .22s; }
  .overlay.open .d-section { transition-delay: .3s; }
  .overlay.open .d-links   { transition-delay: .38s; }

  /* Phone / small tablet: stacked popup, scrollable */
  @media (max-width: 720px) {
    .panel {
      display: block;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-radius: 18px;
    }
    .d-photo img { min-height: 0; height: auto; aspect-ratio: 4 / 4; max-height: 52dvh; }
    .d-body { overflow: visible; justify-content: flex-start; }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    .panel { display: grid; grid-template-columns: 1fr 1.4fr; grid-template-rows: none; overflow: hidden; }
    .d-photo img { height: 100%; aspect-ratio: auto; max-height: none; }
    .d-body { overflow-y: auto; justify-content: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    .d-item, .d-bio { opacity: 1; transform: none; }
  }

  /* ---------- Expertise + links ---------- */
  [hidden] { display: none !important; }

  .d-label {
    color: #8793c9;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  .chip {
    padding: 6px 12px;
    font-size: 12.5px;
    line-height: 1.4;
    color: #d7defc;
    background: rgba(79, 140, 255, .10);
    border: 1px solid rgba(122, 162, 255, .35);
    border-radius: 999px;
    overflow-wrap: anywhere;
  }

  .d-links { display: flex; flex-wrap: wrap; gap: 10px; }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, rgba(79,140,255,.25), rgba(155,107,255,.25));
    border: 1px solid rgba(140, 150, 255, .5);
    border-radius: 12px;
    transition: box-shadow .3s ease, transform .3s ease, border-color .3s ease;
  }

  .link-btn:hover {
    border-color: rgba(180, 190, 255, .9);
    box-shadow: 0 0 20px var(--glow-blue), 0 0 28px rgba(155,107,255,.3);
    transform: translateY(-2px);
  }

  .link-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }

  .overlay.open .d-list    { transition-delay: .46s; }
  .overlay.open .d-bio     { transition-delay: .54s; }

  /* Last orphan card centered (7 employees) */
  @media (min-width: 901px) {
    .grid > .card:last-child:nth-child(3n + 1) { grid-column: 2; }
  }
  @media (max-width: 900px) and (min-width: 721px) and (min-height: 481px) {
    .grid > .card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      justify-self: center;
      width: calc(50% - var(--gap) / 2);
    }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    .grid > .card:last-child:nth-child(3n + 1) { grid-column: 2; }
  }
</style>
</head>

</div>

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const grid = $("grid"), overlay = $("overlay"), panel = $("panel");
const closeBtn = $("close");
let activeCard = null, closing = false;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---------- build cards ---------- */
employees.forEach((p, i) => {
  const card = el("article", "card");
  card.style.setProperty("--i", i);
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-haspopup", "dialog");
  card.setAttribute("aria-label", p.name + " - view details");

  const wrap = el("div", "photo-wrap");
  const img = el("img", "photo");
  img.src = p.photo; img.alt = p.name; img.loading = "lazy"; img.decoding = "async";
  wrap.appendChild(img);

  const info = el("div", "info");
  const role = el("div", "role");
  role.append(el("h3", null, p.line1), el("h3", null, p.line2));
  info.append(el("div", "name", p.name), el("div", "divider"), role);

  card.append(wrap, info);
  card.addEventListener("click", () => openDetails(card, p));
  card.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetails(card, p); }
  });
  grid.appendChild(card);
});

function splitList(v) {
  if (Array.isArray(v)) return v.map((x) => String(x).trim()).filter(Boolean);
  if (!v) return [];
  const out = []; let depth = 0, cur = "";
  for (const ch of String(v)) {
    if (ch === "(") depth++;
    if (ch === ")") depth = Math.max(0, depth - 1);
    if ((ch === "," || ch === "|") && depth === 0) { out.push(cur.trim()); cur = ""; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out.filter(Boolean);
}

function safeUrl(u) {
  if (!u) return "";
  u = String(u).trim();
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; }
  catch (e) { return ""; }
}

/* ---------- fill popup ---------- */
function fill(p) {
  $("d-img").src = p.photo;
  $("d-img").alt = p.name;
  $("d-name").textContent = p.name;
  $("d-title").textContent = p.line1;

  const list = $("d-list");
  list.replaceChildren();
  const rows = [...p.details];
  if (p.department) rows.push(["Department", p.department]);
  if (p.joined)     rows.push(["Joined", p.joined]);
  if (p.location)   rows.push(["Location", p.location]);
  if (p.email)      rows.push(["Email", p.email, "mailto:" + p.email]);
  if (p.phone)      rows.push(["Phone", p.phone, "tel:" + p.phone.replace(/\s+/g, "")]);

  rows.forEach(([k, v, href]) => {
    const row = el("div", "d-row");
    row.appendChild(el("dt", null, k));
    const dd = el("dd");
    if (href) { const a = el("a", null, v); a.href = href; dd.appendChild(a); }
    else dd.textContent = v;
    row.appendChild(dd);
    list.appendChild(row);
  });

  const bio = $("d-bio");
  bio.textContent = p.bio || "";
  bio.hidden = !p.bio;

  list.hidden = !list.children.length;


  const chips = $("d-chips");
  chips.replaceChildren();
  splitList(p.expertise).forEach((t) => chips.appendChild(el("li", "chip", t)));
  $("d-expertise").hidden = !chips.children.length;

  const links = $("d-links");
  links.replaceChildren();
  [["Portfolio", p.portfolio, ICONS.portfolio],
   ["LinkedIn",  p.linkedin,  ICONS.linkedin],
   ["GitHub",    p.github,    ICONS.github]].forEach(([label, raw, icon]) => {
    const url = safeUrl(raw);
    if (!url) return;
    const a = el("a", "link-btn");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.setAttribute("aria-label", label + " (opens in a new tab)");
    a.insertAdjacentHTML("beforeend", icon);
    a.appendChild(el("span", null, label));
    links.appendChild(a);
  });
  links.hidden = !links.children.length;
}


function transformFrom(cardRect, panelRect) {
  const dx = (cardRect.left + cardRect.width / 2) - (panelRect.left + panelRect.width / 2);
  const dy = (cardRect.top + cardRect.height / 2) - (panelRect.top + panelRect.height / 2);
  const s = Math.min(cardRect.width / panelRect.width, 1);
  return "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
}

function openDetails(card, p) {
  if (closing) return;
  activeCard = card;
  fill(p);

  overlay.style.visibility = "visible";
  panel.style.transition = "none";
  panel.style.transform = "none";
  const pr = panel.getBoundingClientRect();
  const cr = card.getBoundingClientRect();
  panel.style.transform = transformFrom(cr, pr);
  panel.getBoundingClientRect();              // reflow
  panel.style.transition = "";

  document.body.style.overflow = "hidden";
  overlay.setAttribute("aria-hidden", "false");
  overlay.classList.add("open");
  card.classList.add("is-open");
  panel.style.transform = "none";
  overlay.style.visibility = "";
  setTimeout(() => closeBtn.focus({ preventScroll: true }), 50);
}

function closeDetails() {
  if (!overlay.classList.contains("open") || closing) return;
  closing = true;
  const card = activeCard;
  const pr = panel.getBoundingClientRect();
  const cr = card.getBoundingClientRect();
  panel.style.transform = transformFrom(cr, pr);
  overlay.classList.remove("open");
  card.classList.remove("is-open");
  overlay.setAttribute("aria-hidden", "true");

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    panel.style.transform = "none";
    document.body.style.overflow = "";
    closing = false;
    card.focus({ preventScroll: true });
  }, reduce ? 0 : 520);
}

closeBtn.addEventListener("click", closeDetails);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeDetails(); });

document.addEventListener("keydown", (e) => {
  if (!overlay.classList.contains("open")) return;
  if (e.key === "Escape") { closeDetails(); return; }
  if (e.key === "Tab") {                       // focus popup er bhitore rakhe
    const f = panel.querySelectorAll("button, a[href]");
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
</script>
